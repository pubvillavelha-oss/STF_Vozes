<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime - Resultado Final</title>
    <link rel="icon" href="data:,">
    <!-- ===== CONFIG CENTRAL ===== -->
    <!-- config.js deve definir:
         const WEB_APP_URL = 'https://script.google.com/macros/s/.../exec';
         const URL_DO_LOGO = 'https://.../logo.png';
         const DRUM_URL   = 'https://.../drumroll.mp3'; (opcional)
         const DRUM_DURACAO = 12; (opcional — segundos do som para sincronizar a revelação) -->
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a2e12, #0f4d1e, #0a2e12);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 96px 16px 24px;
            overflow-x: hidden;
        }
        /* ===== CABEÇALHO FIXO ===== */
        header.fixo {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 20px;
            background: rgba(10, 46, 18, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        .header-logo { flex-shrink: 0; min-width: 0; }
        .header-logo img { height: 56px; width: auto; object-fit: contain; display: block; }
        .header-titulo { flex: 1; text-align: center; min-width: 0; }
        .header-titulo h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #009C3B, #FFDF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        .header-titulo p { color: #aaa; font-size: 0.8rem; }
        .header-acoes { flex-shrink: 0; }
        /* ===== BOTÃO DE APRESENTAÇÃO ===== */
        .btn-revelar {
            display: inline-block;
            padding: 13px 26px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            color: #1a1a2e;
            background: linear-gradient(90deg, #FFDF00, #FFD700);
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            animation: pulseBtn 1.6s ease-in-out infinite;
            white-space: nowrap;
        }
        .btn-revelar:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 215, 0, 0.55); }
        .btn-revelar:active { transform: scale(0.96); }
        .btn-revelar:disabled { opacity: 0.5; cursor: wait; animation: none; }
        .btn-revelar.final { background: linear-gradient(90deg, #009C3B, #00b84a); color: #fff; box-shadow: 0 0 24px rgba(0, 156, 59, 0.4); animation: none; }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        /* ===== LAYOUT 3 COLUNAS (meio = 70%) ===== */
        .layout {
            display: grid;
            grid-template-columns: 15% 70% 15%;
            gap: 14px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .col { min-height: calc(100vh - 120px); border-radius: 16px; }
        .col-esquerda, .col-direita {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .col-centro {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .status-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 14px; flex-wrap: wrap; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }
        .conn-text { font-size: 0.8rem; color: #888; }
        /* ===== PALCO ===== */
        #palco {
            position: relative;
            width: 100%;
            max-width: 760px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .suspense-box { text-align: center; padding: 40px 20px; color: #888; }
        .suspense-box .icon { font-size: 3.5rem; }
        .suspense-box .texto { font-size: 1.3rem; margin-top: 14px; font-weight: 600; color: #bbb; }
        .suspense-box .sub { font-size: 0.9rem; margin-top: 6px; color: #777; }
        /* ===== DRUMROLL + CONTAGEM ===== */
        #drumroll {
            position: absolute; inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.95));
            border-radius: 20px;
            z-index: 20;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        #drumroll.ativo { display: flex; }
        #drumroll .baquetas { font-size: 2.6rem; animation: batida 0.5s ease-in-out infinite; }
        #drumroll .texto { margin-top: 16px; font-size: 1.5rem; font-weight: 800; color: #FFD700; text-transform: uppercase; letter-spacing: 6px; }
        #drumroll .sub { margin-top: 10px; color: #aaa; font-size: 0.95rem; }
        .drum-num { margin-top: 6px; font-size: 6.5rem; font-weight: 900; line-height: 1; color: #FFD700; text-shadow: 0 0 45px rgba(255, 215, 0, 0.85); }
        .drum-num.pop { animation: numPop 0.78s ease-out; }
        @keyframes numPop {
            0% { transform: scale(2.4); opacity: 0; }
            30% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes batida {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.35) rotate(-8deg); }
        }
        /* ===== CARDS REVELADOS ===== */
        .revelado {
            width: 100%;
            max-width: 640px;
            text-align: center;
            padding: 28px 20px;
            border-radius: 20px;
            animation: revelar 0.6s ease-out;
        }
        @keyframes revelar {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(6px); }
            60% { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .revelado .place { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; }
        .revelado .nome { font-size: 2.2rem; font-weight: 800; color: #fff; margin-top: 8px; }
        .revelado .score { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
        .revelado .sub { font-size: 0.85rem; color: #999; margin-top: 4px; }
        .revelado.p-outros { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .revelado.p-outros .place { color: #bbb; }
        .revelado.p-outros .score { color: #bbb; }
        .revelado.p3 { background: linear-gradient(180deg, rgba(205, 127, 50, 0.12), rgba(255, 255, 255, 0.03)); border: 2px solid rgba(205, 127, 50, 0.5); }
        .revelado.p3 .place { color: #CD7F32; }
        .revelado.p3 .score { color: #CD7F32; }
        .revelado.p2 { background: linear-gradient(180deg, rgba(192, 192, 192, 0.14), rgba(255, 255, 255, 0.03)); border: 2px solid rgba(192, 192, 192, 0.5); }
        .revelado.p2 .place { color: #C0C0C0; }
        .revelado.p2 .score { color: #C0C0C0; }
        /* ===== CAMPEÃO ===== */
        .revelado.p1 {
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.18), rgba(0, 156, 59, 0.1));
            border: 3px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.35);
            animation: revelarCampeao 0.9s ease-out;
            position: relative;
            overflow: hidden;
        }
        @keyframes revelarCampeao {
            0% { opacity: 0; transform: scale(0.5) rotate(-4deg); filter: blur(10px); }
            70% { transform: scale(1.06) rotate(0deg); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        .revelado.p1 .trophy { font-size: 4rem; animation: float 2.2s ease-in-out infinite; margin-bottom: 6px; }
        .revelado.p1 .place { color: #FFD700; font-size: 1.05rem; }
        .revelado.p1 .nome { font-size: 3rem; background: linear-gradient(90deg, #fff, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .revelado.p1 .score { color: #FFD700; font-size: 1.5rem; }
        .revelado.p1 .likes-badge { color: #FFD700; font-size: 1.1rem; margin-top: 4px; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* ===== FOTOS ===== */
        .foto-slot { display: flex; justify-content: center; margin: 0 auto 10px; }
        .foto-slot.mini { display: inline-flex; margin: 0; vertical-align: middle; }
        .foto-iniciais {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #009C3B, #0f4d1e);
            color: #FFDF00;
            font-weight: 800;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.55);
            flex-shrink: 0;
        }
        .foto-wrap {
            position: relative;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.55);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .foto-wrap .foto { display: none; object-fit: cover; }
        .foto-wrap .foto-iniciais { position: absolute; inset: 0; border: none; border-radius: 50%; }
        /* ===== CONFETES ===== */
        .confete { position: absolute; top: -10px; width: 10px; height: 10px; opacity: 0.9; animation: cair linear forwards; }
        @keyframes cair {
            to { transform: translateY(460px) rotate(720deg); opacity: 0; }
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #0a2e12; color: #fff; padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.9rem; opacity: 0;
            transition: opacity 0.4s, bottom 0.4s; pointer-events: none; z-index: 999;
            white-space: nowrap; max-width: 90%;
        }
        .toast.show { opacity: 1; bottom: 50px; }
        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .col-esquerda, .col-direita { display: none; }
            .header-titulo h1 { font-size: 1.2rem; }
            .header-logo img { height: 40px; }
            .btn-revelar { padding: 10px 16px; font-size: 0.85rem; }
            .revelado .nome { font-size: 1.7rem; }
            .revelado.p1 .nome { font-size: 2.2rem; }
            .drum-num { font-size: 5rem; }
        }
    </style>
</head>
<body>
<header class="fixo">
    <div class="header-logo">
        <img id="logoShowTime" alt="Logo ShowTime Festival de Vozes" />
    </div>
    <div class="header-titulo">
        <h1>Resultado Final</h1>
        <p>ShowTime Festival de Vozes</p>
    </div>
    <div class="header-acoes">
        <button class="btn-revelar" id="btnRevelar" onclick="revelarProximo()">🎲 Apresentar Resultados</button>
    </div>
</header>
<div class="layout">
    <aside class="col col-esquerda"></aside>
    <main class="col col-centro">
        <div class="status-row">
            <span class="status-dot" id="statusDot"></span>
            <span class="conn-text" id="statusText">Conectando...</span>
        </div>
        <div id="palco">
            <div class="suspense-box" id="estadoInicial">
                <div class="icon">🎬</div>
                <div class="texto">Os resultados estão prontos...</div>
                <div class="sub">Clique no botão para revelar, um a um, do 4º lugar até o vencedor.</div>
            </div>
            <div id="revelados" style="width:100%; display:flex; flex-direction:column; gap:12px; align-items:center;"></div>
            <div id="drumroll">
                <div class="baquetas">🥁</div>
                <div class="texto">Drumroll...</div>
                <div class="drum-num" id="drumNum">3</div>
                <div class="sub">Contagem para a revelação</div>
            </div>
        </div>
    </main>
    <aside class="col col-direita"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
    // ============================================================
    // 🔥 CONFIGURAÇÃO
    // ------------------------------------------------------------
    // CORREÇÃO: variáveis locais renomeadas (appUrl, logoUrl,
    // audioDrumUrl) para NÃO colidirem com os globais do config.js
    // (WEB_APP_URL, LOGO_URL, URL_DO_LOGO, DRUM_URL).
    // Redeclarar um nome global com let/const gera SyntaxError
    // e derruba o script inteiro.
    // ============================================================
    let appUrl = '';
    try {
        appUrl = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL)
            ? WEB_APP_URL
            : (window.WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbzmL1IU10IKyyjd6H48iRATaLmLWfOKnnjXFuQ70VAOn4l6zmlI5KHhenraDT24LCLzRg/exec');
    } catch (e) {
        appUrl = window.WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbzmL1IU10IKyyjd6H48iRATaLmLWfOKnnjXFuQ70VAOn4l6zmlI5KHhenraDT24LCLzRg/exec';
    }
    let logoUrl = '';
    try {
        logoUrl = (typeof LOGO_URL !== 'undefined' && LOGO_URL) ? LOGO_URL
            : ((typeof URL_DO_LOGO !== 'undefined' && URL_DO_LOGO) ? URL_DO_LOGO
            : (window.LOGO_URL || window.URL_DO_LOGO || ''));
    } catch (e) { logoUrl = ''; }
    let audioDrumUrl = '';
    try {
        audioDrumUrl = (typeof DRUM_URL !== 'undefined' && DRUM_URL) ? DRUM_URL : (window.DRUM_URL || '');
    } catch (e) { audioDrumUrl = ''; }

    // ===== LOGO NO CABEÇALHO =====
    const logoEl = document.getElementById('logoShowTime');
    if (logoEl) {
        if (logoUrl) {
            logoEl.src = logoUrl;
            logoEl.onerror = function () { this.style.display = 'none'; };
        } else {
            logoEl.style.display = 'none';
        }
    }

    // ===== DOM =====
    let statusDot = document.getElementById('statusDot');
    let statusText = document.getElementById('statusText');
    let btnRevelar = document.getElementById('btnRevelar');
    let reveladosEl = document.getElementById('revelados');
    let drumroll = document.getElementById('drumroll');
    let drumNum = document.getElementById('drumNum');
    let estadoInicial = document.getElementById('estadoInicial');
    let toastTimer = null;

    // ===== ESTADO DA REVELAÇÃO =====
    let ranking = [];
    let demais = [];
    let sequencia = []; // ordem: 4º+ → 3º → 2º → 1º
    let indice = 0;
    let revelacaoIniciada = false;

    // ===== ÁUDIO =====
    let audioDrum = null;
    let audioCtx = null;
    let drumDuracao = 3; // segundos do drumroll (ajustado automaticamente pela duração do MP3)

    function tocarDrumroll() {
        if (audioDrumUrl) {
            try {
                if (!audioDrum) {
                    audioDrum = new Audio(audioDrumUrl);
                    audioDrum.volume = 0.9;
                    // Captura a duração real do arquivo assim que o navegador ler o MP3
                    audioDrum.addEventListener('loadedmetadata', function () {
                        if (audioDrum && audioDrum.duration && isFinite(audioDrum.duration)) {
                            drumDuracao = audioDrum.duration;
                        }
                    });
                }
                audioDrum.currentTime = 0;
                const p = audioDrum.play();
                if (p !== undefined) { p.catch(function () { tocarDrumrollSintetizado(); }); return; }
                return;
            } catch (e) { /* usa síntese */ }
        }
        tocarDrumrollSintetizado();
    }
    function tocarDrumrollSintetizado() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t0 = audioCtx.currentTime;
            for (let i = 0; i < 7; i++) {
                const t = t0 + 0.16 * i + Math.pow(i, 1.6) * 0.05;
                const dur = 0.12;
                const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 2);
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const filtro = audioCtx.createBiquadFilter();
                filtro.type = 'highpass';
                filtro.frequency.value = 1400;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.6, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                src.connect(filtro); filtro.connect(g); g.connect(audioCtx.destination);
                src.start(t);
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, t);
                osc.frequency.exponentialRampToValueAtTime(45, t + 0.16);
                const g2 = audioCtx.createGain();
                g2.gain.setValueAtTime(0.8, t);
                g2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.connect(g2); g2.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.2);
            }
        } catch (e) { /* sem suporte a áudio */ }
    }
    function tocarFanfarra() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t0 = audioCtx.currentTime;
            const notas = [261.63, 329.63, 392.00, 523.25];
            notas.forEach(function (f, i) {
                const t = t0 + i * 0.12;
                const o = audioCtx.createOscillator();
                o.type = 'triangle';
                o.frequency.value = f;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(0.5, t + 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(t); o.stop(t + 1);
            });
        } catch (e) {}
    }

    // ===== HELPERS =====
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }
    function setStatus(online) {
        statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
        statusText.textContent = online ? 'Online' : 'Offline';
    }
    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    function mediaDe(r) {
        return r.avaliacoes ? (r.total / r.avaliacoes).toFixed(1) : '0.0';
    }
    function likesDe(r) {
        return Number(r.likes) || 0;
    }
    function iniciaisNome(nome) {
        const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
        if (!partes.length) return '?';
        const prim = partes[0][0] || '';
        const ult = partes.length > 1 ? (partes[partes.length - 1][0] || '') : '';
        return (prim + ult).toUpperCase();
    }

    // ===== IMAGENS =====
    function urlsImagem(url) {
        const lista = [];
        if (!url) return lista;
        url = String(url).trim();
        const mOpen = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        const mFile = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const mUc = url.match(/\/uc\?export=view&id=([a-zA-Z0-9_-]+)/);
        const mThumb = url.match(/\/thumbnail\?id=([a-zA-Z0-9_-]+)/);
        let id = null;
        if (mOpen) id = mOpen[1];
        else if (mFile) id = mFile[1];
        else if (mUc) id = mUc[1];
        else if (mThumb) id = mThumb[1];
        if (id) {
            lista.push('https://drive.google.com/thumbnail?id=' + id + '&sz=w400');
            lista.push('https://lh3.googleusercontent.com/d/' + id + '=w400');
            lista.push('https://drive.google.com/uc?export=view&id=' + id);
        }
        if (url.indexOf('http') === 0) lista.push(url);
        return lista;
    }

    // ===== CARREGA A FOTO COM LOG E TIMEOUT =====
    // Tenta cada URL da lista em sequência. Registra no console o que
    // acontece (sucesso ou falha) e pula URLs que não respondem em 8s.
    function carregarFoto(img, urls, i) {
        if (i >= urls.length) { mostrarIniciais(img); return; }
        let carregou = false;
        function tentarProxima() {
            if (carregou) return;
            carregarFoto(img, urls, i + 1);
        }
        img.onerror = function () {
            console.warn('[Foto] URL falhou (' + i + '):', urls[i]);
            tentarProxima();
        };
        img.onload = function () {
            if (!img.naturalWidth) {
                console.warn('[Foto] URL retornou sem imagem (' + i + '):', urls[i]);
                tentarProxima();
            } else {
                carregou = true;
                img.style.display = 'block';
                console.log('[Foto] carregada com sucesso:', urls[i]);
            }
        };
        img.src = urls[i];
        // Se a URL não responder em 8s, pula para a próxima
        setTimeout(function () {
            if (!carregou && !img.complete) tentarProxima();
        }, 8000);
    }
    function mostrarIniciais(img) {
        try {
            img.onerror = null;
            img.onload = null;
            img.style.display = 'none';
            const ini = img.previousElementSibling;
            if (ini) ini.style.display = 'flex';
        } catch (e) { /* ignora */ }
    }
    function fotoHTML(r, tam) {
        const t = tam || 84;
        const ini = document.createElement('div');
        ini.className = 'foto-iniciais';
        ini.style.width = t + 'px';
        ini.style.height = t + 'px';
        ini.style.fontSize = Math.round(t * 0.36) + 'px';
        ini.textContent = iniciaisNome(r.candidato);
        const urls = urlsImagem(r.imagem);
        if (!urls.length) return ini;
        const wrap = document.createElement('div');
        wrap.className = 'foto-wrap';
        wrap.style.width = t + 'px';
        wrap.style.height = t + 'px';
        wrap.appendChild(ini);
        const img = document.createElement('img');
        img.className = 'foto';
        img.alt = 'Foto de ' + (r.candidato || '');
        img.style.width = t + 'px';
        img.style.height = t + 'px';
        wrap.appendChild(img);
        carregarFoto(img, urls, 0);
        return wrap;
    }
    function preencherFotos(container) {
        if (!container) return;
        container.querySelectorAll('.foto-slot').forEach(function (slot) {
            if (slot.querySelector('.foto-wrap, .foto-iniciais')) return;
            const r = {
                candidato: slot.getAttribute('data-nome') || '',
                imagem: slot.getAttribute('data-img') || ''
            };
            const t = Number(slot.getAttribute('data-tam')) || 84;
            slot.appendChild(fotoHTML(r, t));
        });
    }

    // ===== CARREGA RESULTADO =====
    async function carregarResultado() {
        try {
            if (!appUrl) {
                showToast('⚠️ config.js não carregou ou WEB_APP_URL não definida.');
                setStatus(false);
                return;
            }
            const res = await fetch(appUrl + '?acao=ranking');
            const json = await res.json();
            if (!json.ok) { showToast('⚠️ Erro ao carregar resultado.'); setStatus(false); return; }
            ranking = json.ranking || [];
            setStatus(true);
            prepararRevelacao();
        } catch (err) {
            console.error('[Resultado] Erro:', err);
            setStatus(false);
            showToast('⚠️ Erro de conexão.');
        }
    }

    // ===== SEQUÊNCIA DA CERIMÔNIA (4º+ → 3º → 2º → 1º) =====
    function montarSequencia() {
        sequencia = [];
        if (demais.length) sequencia.push({ tipo: 'demais' });
        if (ranking[2]) sequencia.push({ tipo: 'p3', item: ranking[2] });
        if (ranking[1]) sequencia.push({ tipo: 'p2', item: ranking[1] });
        if (ranking[0]) sequencia.push({ tipo: 'p1', item: ranking[0] });
        indice = 0;
    }
    function prepararRevelacao() {
        revelacaoIniciada = false;
        demais = ranking.slice(3);
        montarSequencia();
        if (reveladosEl) reveladosEl.innerHTML = '';
        if (!ranking.length) {
            if (estadoInicial) estadoInicial.innerHTML = '<div class="icon">🎤</div><div class="texto">Ainda não há avaliações lançadas.</div><div class="sub">Assim que os jurados avaliarem, os resultados aparecem aqui.</div>';
            if (btnRevelar) btnRevelar.style.display = 'none';
            return;
        }
        if (btnRevelar) {
            btnRevelar.style.display = 'inline-block';
            btnRevelar.onclick = revelarProximo;
            atualizarBotaoAposRevelacao();
        }
        if (estadoInicial) estadoInicial.style.display = 'block';
    }
    function revelarProximo() {
        if (revelacaoIniciada || indice >= sequencia.length) return;
        revelacaoIniciada = true;
        btnRevelar.disabled = true;
        if (estadoInicial) estadoInicial.style.display = 'none';
        const alvo = sequencia[indice];
        tocarDrumroll();
        mostrarDrumroll(function () {
            exibir(alvo);
            if (alvo.tipo === 'p1') tocarFanfarra();
            indice++;
            revelacaoIniciada = false;
            btnRevelar.disabled = false;
            if (alvo.tipo === 'p1') finalizarRevelacao();
            else atualizarBotaoAposRevelacao();
        });
    }
    // ===== DRUMROLL: CONTAGEM DISTRIBUÍDA PELA DURAÇÃO DO SOM =====
    function mostrarDrumroll(callback) {
        drumroll.classList.add('ativo');
        const numeros = [3, 2, 1];

        // Prioridade da duração:
        // 1) DRUM_DURACAO definido no config.js (mais confiável)
        // 2) Duração real do áudio (detectada via loadedmetadata)
        // 3) Padrão: 3 segundos
        let alvo = drumDuracao;
        try {
            if (typeof DRUM_DURACAO !== 'undefined' && DRUM_DURACAO) {
                alvo = Number(DRUM_DURACAO) || drumDuracao;
            }
        } catch (e) {}

        // Cada número (3, 2, 1) ocupa 1/3 da duração total do som
        const passoMs = Math.max(350, Math.round((alvo * 1000) / numeros.length));
        let i = 0;
        function passo() {
            if (i < numeros.length) {
                drumNum.textContent = numeros[i];
                drumNum.classList.remove('pop');
                void drumNum.offsetWidth;
                drumNum.classList.add('pop');
                i++;
                setTimeout(passo, passoMs);
            } else {
                drumroll.classList.remove('ativo');
                callback(); // revela o candidato exatamente quando o som termina
            }
        }
        passo();
    }

    // ===== ATUALIZA O BOTÃO PARA O PRÓXIMO ALVO =====
    function atualizarBotaoAposRevelacao() {
        if (!btnRevelar) return;
        const prox = sequencia[indice];
        if (!prox) return;
        if (prox.tipo === 'p1') {
            btnRevelar.textContent = 'Apresentar o Vencedor';
            btnRevelar.classList.add('final');
        } else if (prox.tipo === 'p2') {
            btnRevelar.textContent = 'Revelar 2º lugar';
            btnRevelar.classList.remove('final');
        } else if (prox.tipo === 'p3') {
            btnRevelar.textContent = 'Revelar 3º lugar';
            btnRevelar.classList.remove('final');
        } else {
            btnRevelar.textContent = demais.length === 1
                ? '🎲 Revelar o 4º classificado'
                : `🎲 Revelar do 4º ao ${demais.length + 3}º lugar`;
            btnRevelar.classList.remove('final');
        }
    }

    // ===== EXIBE OS CARDS (novo resultado sempre ACIMA) =====
    function exibir(alvo) {
        if (alvo.tipo === 'demais') {
            const itens = demais.map(function (r, i) {
                return `
                    <div style="display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <span style="font-weight:800;color:#009C3B;min-width:34px;">${i + 4}º</span>
                        <span class="foto-slot mini" data-nome="${esc(r.candidato)}" data-img="${esc(r.imagem || '')}" data-tam="38"></span>
                        <span style="flex:1;text-align:left;">${esc(r.candidato)}</span>
                        <span style="color:#4ade80;font-weight:700;white-space:nowrap;">${r.total} pts · ⭐ ${likesDe(r)}</span>
                    </div>`;
            }).join('');
            reveladosEl.insertAdjacentHTML('afterbegin', `
                <div class="revelado p-outros">
                    <div class="place">Demais classificados</div>
                    <div style="margin-top:12px;text-align:left;padding:0 10px;">${itens}</div>
                </div>`);
            preencherFotos(reveladosEl);
            return;
        }
        if (alvo.tipo === 'p3') {
            const r = alvo.item;
            reveladosEl.insertAdjacentHTML('afterbegin', `
                <div class="revelado p3">
                    <div class="place">🥉 3º Lugar</div>
                    <div class="foto-slot" data-nome="${esc(r.candidato)}" data-img="${esc(r.imagem || '')}" data-tam="90"></div>
                    <div class="nome">${esc(r.candidato)}</div>
                    <div class="score">${r.total} pts ⭐ ${likesDe(r)} likes</div>
                    <div class="sub">${r.avaliacoes} nota(s) lançadas · média ${mediaDe(r)} · total de likes: ${likesDe(r)}</div>
                </div>`);
            preencherFotos(reveladosEl);
            return;
        }
        if (alvo.tipo === 'p2') {
            const r = alvo.item;
            reveladosEl.insertAdjacentHTML('afterbegin', `
                <div class="revelado p2">
                    <div class="place">🥈 2º Lugar</div>
                    <div class="foto-slot" data-nome="${esc(r.candidato)}" data-img="${esc(r.imagem || '')}" data-tam="90"></div>
                    <div class="nome">${esc(r.candidato)}</div>
                    <div class="score">${r.total} pts ⭐ ${likesDe(r)} likes</div>
                    <div class="sub">${r.avaliacoes} nota(s) lançadas · média ${mediaDe(r)} · total de likes: ${likesDe(r)}</div>
                </div>`);
            preencherFotos(reveladosEl);
            return;
        }
        if (alvo.tipo === 'p1') {
            exibirCampeao(alvo.item);
        }
    }

    // ===== CAMPEÃO COM CONFETES =====
    function exibirCampeao(campeao) {
        reveladosEl.innerHTML = `
            <div class="revelado p1" id="cardCampeao">
                <div class="trophy">🏆</div>
                <div class="foto-slot" data-nome="${esc(campeao.candidato)}" data-img="${esc(campeao.imagem || '')}" data-tam="150"></div>
                <div class="place">Grande Campeão ShowTime</div>
                <div class="nome">${esc(campeao.candidato)}</div>
                <div class="score">${campeao.total} pontos</div>
                <div class="likes-badge">⭐ ${likesDe(campeao)} likes</div>
                <div class="sub">${campeao.avaliacoes} nota(s) lançadas · média ${mediaDe(campeao)} · total de likes: ${likesDe(campeao)}</div>
            </div>`;
        preencherFotos(reveladosEl);
        lancarConfetes();
    }
    function lancarConfetes() {
        const card = document.getElementById('cardCampeao');
        if (!card) return;
        const cores = ['#FFD700', '#009C3B', '#FFDF00', '#ffffff', '#4ade80', '#f7971e'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confete';
            c.style.left = (Math.random() * 100) + '%';
            c.style.background = cores[Math.floor(Math.random() * cores.length)];
            c.style.animationDuration = (1.4 + Math.random() * 1.6) + 's';
            c.style.animationDelay = (Math.random() * 0.5) + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            c.style.width = (6 + Math.random() * 6) + 'px';
            c.style.height = (6 + Math.random() * 6) + 'px';
            card.appendChild(c);
        }
    }

    // ===== FIM DA REVELAÇÃO / REINICIAR =====
    function finalizarRevelacao() {
        btnRevelar.textContent = '🔄 Reiniciar revelação';
        btnRevelar.classList.remove('final');
        btnRevelar.onclick = reiniciarRevelacao;
    }
    function reiniciarRevelacao() {
        if (reveladosEl) reveladosEl.innerHTML = '';
        if (estadoInicial) {
            estadoInicial.style.display = 'block';
            estadoInicial.innerHTML = '<div class="icon">🎬</div><div class="texto">Os resultados estão prontos...</div><div class="sub">Clique no botão para revelar, um a um, do 4º lugar até o grande campeão.</div>';
        }
        prepararRevelacao();
    }

    // ===== INICIA =====
    carregarResultado();
    setInterval(function () {
        if (revelacaoIniciada || indice > 0) return;
        carregarResultado();
    }, 15000);
</script>
