<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime - Avaliação dos Jurados</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a2e12, #0f4d1e, #0a2e12);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 24px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 16px 0 24px; }
        header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #009C3B, #FFDF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #aaa; margin-top: 6px; font-size: 0.9rem; }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 1rem;
            transition: border 0.2s;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 60px; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #009C3B;
            box-shadow: 0 0 0 3px rgba(0, 156, 59, 0.25);
        }
        select option { background: #0a2e12; color: #fff; }
        .quesito-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .quesito-card .titulo {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        .quesito-card .descricao {
            font-size: 0.85rem;
            color: #888;
            margin-top: 2px;
        }
        .nota-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .nota-row label { margin: 0; font-size: 0.85rem; }
        .nota-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #ccc;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .nota-btn:hover { border-color: #009C3B; color: #4ade80; }
        .nota-btn.selecionada {
            background: #009C3B;
            border-color: #009C3B;
            color: #fff;
            transform: scale(1.08);
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            background: linear-gradient(90deg, #009C3B, #00b84a);
            color: #fff;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .total-box {
            text-align: center;
            padding: 16px;
            background: rgba(0, 156, 59, 0.12);
            border: 1px solid rgba(0, 156, 59, 0.3);
            border-radius: 12px;
            margin-top: 16px;
        }
        .total-box .label { font-size: 0.85rem; color: #aaa; }
        .total-box .valor { font-size: 2rem; font-weight: 800; color: #4ade80; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a2e12;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.4s, bottom 0.4s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>⭐ Avaliação dos Jurados</h1>
        <p>ShowTime Festival de Vozes</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="jurado">Nome do Jurado *</label>
            <input type="text" id="jurado" placeholder="Ex: Marcelle Maganha" required />
        </div>
        <div class="form-group">
            <label for="candidato">Candidato *</label>
            <select id="candidato" required>
                <option value="">Selecione o candidato...</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 12px; color: #aaa;">Quesitos de avaliação</h3>
        <div id="quesitosList">
            <div style="color: #555; text-align: center; padding: 20px;">Carregando quesitos...</div>
        </div>
        <div class="total-box">
            <div class="label">Total da avaliação</div>
            <div class="valor" id="totalValor">0</div>
        </div>
        <button class="btn" id="btnEnviar" style="width: 100%; margin-top: 16px;" onclick="enviarAvaliacao()">📤 Enviar avaliação</button>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
    // ============================================================
    // 🔥 CONFIGURAÇÃO DO GOOGLE SHEETS (WEB APP)
    // ============================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzmL1IU10IKyyjd6H48iRATaLmLWfOKnnjXFuQ70VAOn4l6zmlI5KHhenraDT24LCLzRg/exec';

    const inputJurado = document.getElementById('jurado');
    const selectCandidato = document.getElementById('candidato');
    const quesitosList = document.getElementById('quesitosList');
    const totalValor = document.getElementById('totalValor');
    const btnEnviar = document.getElementById('btnEnviar');
    let toastTimer = null;
    let quesitos = [];
    let notas = {}; // linha -> nota

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== CARREGA CANDIDATOS =====
    async function carregarCandidatos() {
        try {
            const res = await fetch(WEB_APP_URL + '?acao=candidatos');
            const json = await res.json();
            if (!json.ok) return;
            const lista = (json.candidatos || []).filter(c => c.status !== 'No Palco');
            selectCandidato.innerHTML = '<option value="">Selecione o candidato...</option>' +
                lista.map(c => `<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('');
        } catch (err) {
            showToast('⚠️ Erro ao carregar candidatos.');
        }
    }

    // ===== CARREGA QUESITOS =====
    async function carregarQuesitos() {
        try {
            const res = await fetch(WEB_APP_URL + '?acao=quesitos');
            const json = await res.json();
            if (!json.ok) {
                showToast('⚠️ Erro ao carregar quesitos.');
                return;
            }
            quesitos = json.quesitos || [];
            renderizarQuesitos();
        } catch (err) {
            showToast('⚠️ Erro de conexão.');
        }
    }

    function renderizarQuesitos() {
        if (!quesitos.length) {
            quesitosList.innerHTML = '<div style="color: #555; text-align: center; padding: 20px;">Nenhum quesito cadastrado. Cadastre na tela de Quesitos.</div>';
            return;
        }
        quesitosList.innerHTML = quesitos.map(q => `
            <div class="quesito-card">
                <div class="titulo">${esc(q.ordem || '')}. ${esc(q.quesito)}</div>
                <div class="descricao">${esc(q.descricao || '')}</div>
                <div class="nota-row">
                    <label>Nota:</label>
                    ${[5,6,7,8,9,10].map(n => `
                        <button type="button" class="nota-btn" data-linha="${q.linha}" data-nota="${n}" onclick="marcarNota(${q.linha}, ${n})">${n}</button>
                    `).join('')}
                </div>
                <div class="form-group" style="margin-top: 10px; margin-bottom: 0;">
                    <label>Observações para o candidato</label>
                    <textarea data-obs="${q.linha}" placeholder="Escreva suas considerações..."></textarea>
                </div>
            </div>
        `).join('');
    }

    // ===== MARCA NOTA =====
    function marcarNota(linha, nota) {
        notas[linha] = nota;
        // Atualiza visual
        document.querySelectorAll(`.nota-btn[data-linha="${linha}"]`).forEach(btn => {
            btn.classList.toggle('selecionada', Number(btn.dataset.nota) === nota);
        });
        // Atualiza total
        const total = Object.values(notas).reduce((s, n) => s + n, 0);
        totalValor.textContent = total;
    }

    // ===== ENVIA AVALIAÇÃO =====
    async function enviarAvaliacao() {
        const jurado = inputJurado.value.trim();
        const candidato = selectCandidato.value;
        if (!jurado) { showToast('⚠️ Informe o nome do jurado.'); return; }
        if (!candidato) { showToast('⚠️ Selecione o candidato.'); return; }
        if (Object.keys(notas).length === 0) { showToast('⚠️ Marque pelo menos uma nota.'); return; }

        btnEnviar.disabled = true;
        btnEnviar.textContent = '⏳ Enviando...';

        try {
            // Envia uma linha por quesito
            for (const q of quesitos) {
                const nota = notas[q.linha];
                if (nota === undefined) continue;
                const obsEl = document.querySelector(`textarea[data-obs="${q.linha}"]`);
                const observacao = obsEl ? obsEl.value.trim() : '';
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        acao: 'avaliacao',
                        jurado: jurado,
                        candidato: candidato,
                        quesito: q.quesito,
                        nota: nota,
                        observacao: observacao
                    })
                });
                const json = await res.json();
                if (!json.ok) {
                    showToast('⚠️ Erro ao enviar avaliação.');
                    btnEnviar.disabled = false;
                    btnEnviar.textContent = '📤 Enviar avaliação';
                    return;
                }
            }
            showToast('✅ Avaliação enviada com sucesso!');
            // Limpa o formulário
            notas = {};
            totalValor.textContent = '0';
            inputJurado.value = '';
            selectCandidato.value = '';
            renderizarQuesitos();
            btnEnviar.disabled = false;
            btnEnviar.textContent = '📤 Enviar avaliação';
        } catch (err) {
            showToast('⚠️ Erro de conexão.');
            btnEnviar.disabled = false;
            btnEnviar.textContent = '📤 Enviar avaliação';
        }
    }

    // ===== INICIA =====
    carregarCandidatos();
    carregarQuesitos();
</script>
</body>
</html>
