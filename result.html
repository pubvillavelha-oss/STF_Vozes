<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowTime - Resultado Final</title>
    <!-- ===== CONFIG CENTRAL (URL do Web App) ===== -->
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a2e12, #0f4d1e, #0a2e12);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 24px;
            overflow-x: hidden;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 16px 0 24px; }
        header h1 {
            font-size: 2.4rem;
            background: linear-gradient(90deg, #009C3B, #FFDF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #aaa; margin-top: 6px; font-size: 0.95rem; }
        .status-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 20px; flex-wrap: wrap; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }
        .conn-text { font-size: 0.8rem; color: #888; }

        /* ===== ÁREA CENTRAL DE SUSPENSE ===== */
        #palco {
            position: relative;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .suspense-box {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .suspense-box .icon { font-size: 3.5rem; }
        .suspense-box .texto { font-size: 1.3rem; margin-top: 14px; font-weight: 600; color: #bbb; }
        .suspense-box .sub { font-size: 0.9rem; margin-top: 6px; color: #777; }

        /* ===== BOTÃO DE REVELAÇÃO ===== */
        .btn-revelar {
            display: inline-block;
            padding: 16px 40px;
            margin-top: 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            color: #1a1a2e;
            background: linear-gradient(90deg, #FFDF00, #FFD700);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            animation: pulseBtn 1.6s ease-in-out infinite;
        }
        .btn-revelar:hover { transform: scale(1.05); box-shadow: 0 0 45px rgba(255, 215, 0, 0.55); }
        .btn-revelar:active { transform: scale(0.96); }
        .btn-revelar:disabled { opacity: 0.5; cursor: wait; animation: none; }
        .btn-revelar.final { background: linear-gradient(90deg, #009C3B, #00b84a); color: #fff; box-shadow: 0 0 30px rgba(0, 156, 59, 0.4); animation: none; }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* ===== DRUMROLL (suspense antes de cada revelação) ===== */
        #drumroll {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.95));
            border-radius: 20px;
            z-index: 20;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        #drumroll.ativo { display: flex; }
        #drumroll .baquetas { font-size: 2.6rem; animation: batida 0.5s ease-in-out infinite; }
        #drumroll .texto {
            margin-top: 16px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 6px;
        }
        #drumroll .sub { margin-top: 8px; color: #aaa; font-size: 0.95rem; }
        @keyframes batida {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.35) rotate(-8deg); }
        }

        /* ===== CARD DE RESULTADO REVELADO ===== */
        .revelado {
            width: 100%;
            max-width: 640px;
            text-align: center;
            padding: 28px 20px;
            border-radius: 20px;
            animation: revelar 0.6s ease-out;
            margin-bottom: 12px;
        }
        @keyframes revelar {
            0% { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(6px); }
            60% { transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        /* Posições reveladas */
        .revelado .place { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; }
        .revelado .nome { font-size: 2.2rem; font-weight: 800; color: #fff; margin-top: 8px; }
        .revelado .score { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
        .revelado .sub { font-size: 0.85rem; color: #999; margin-top: 4px; }
        .revelado.p-outros { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .revelado.p-outros .place { color: #bbb; }
        .revelado.p-outros .score { color: #bbb; }
        .revelado.p3 { background: linear-gradient(180deg, rgba(205, 127, 50, 0.12), rgba(255, 255, 255, 0.03)); border: 2px solid rgba(205, 127, 50, 0.5); }
        .revelado.p3 .place { color: #CD7F32; }
        .revelado.p3 .score { color: #CD7F32; }
        .revelado.p2 { background: linear-gradient(180deg, rgba(192, 192, 192, 0.14), rgba(255, 255, 255, 0.03)); border: 2px solid rgba(192, 192, 192, 0.5); }
        .revelado.p2 .place { color: #C0C0C0; }
        .revelado.p2 .score { color: #C0C0C0; }
        /* Campeão */
        .revelado.p1 {
            background: linear-gradient(180deg, rgba(255, 215, 0, 0.18), rgba(0, 156, 59, 0.1));
            border: 3px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.35);
            animation: revelarCampeao 0.9s ease-out;
            position: relative;
            overflow: hidden;
        }
        @keyframes revelarCampeao {
            0% { opacity: 0; transform: scale(0.5) rotate(-4deg); filter: blur(10px); }
            70% { transform: scale(1.06) rotate(0deg); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        .revelado.p1 .trophy { font-size: 4rem; animation: float 2.2s ease-in-out infinite; }
        .revelado.p1 .place { color: #FFD700; font-size: 1.05rem; }
        .revelado.p1 .nome { font-size: 3rem; background: linear-gradient(90deg, #fff, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .revelado.p1 .score { color: #FFD700; font-size: 1.5rem; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        /* Confetes dos campeão (CSS puro) */
        .confete { position: absolute; top: -10px; width: 10px; height: 10px; opacity: 0.9; animation: cair linear forwards; }
        @keyframes cair {
            to { transform: translateY(420px) rotate(720deg); opacity: 0; }
        }

        /* ===== DEMais JÁ REVELADOS (histórico da revelação) ===== */
        #historico { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #0a2e12; color: #fff; padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.9rem; opacity: 0;
            transition: opacity 0.4s, bottom 0.4s; pointer-events: none; z-index: 999;
            white-space: nowrap; max-width: 90%;
        }
        .toast.show { opacity: 1; bottom: 50px; }

        @media (max-width: 600px) {
            .revelado .nome { font-size: 1.7rem; }
            .revelado.p1 .nome { font-size: 2.2rem; }
            .btn-revelar { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🏆 Resultado Final</h1>
        <p>ShowTime Festival de Vozes</p>
    </header>
    <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="conn-text" id="statusText">Conectando...</span>
    </div>

    <!-- PALCO DA REVELAÇÃO -->
    <div id="palco">
        <!-- Estado inicial -->
        <div class="suspense-box" id="estadoInicial">
            <div class="icon">🎬</div>
            <div class="texto">Os resultados estão prontos...</div>
            <div class="sub">Clique no botão para revelar, um a um, do 3º lugar até o grande campeão.</div>
        </div>
        <!-- Cards revelados ficam aqui -->
        <div id="revelados" style="width:100%; display:flex; flex-direction:column; gap:10px; align-items:center;"></div>
        <!-- Botão de revelação -->
        <button class="btn-revelar" id="btnRevelar" onclick="revelarProximo()">🎲 Revelar 3º lugar</button>
        <!-- Drumroll de suspense -->
        <div id="drumroll">
            <div class="baquetas">🥁</div>
            <div class="texto">Drumroll...</div>
            <div class="sub">Preparando a revelação</div>
        </div>
    </div>

    <!-- Histórico dos já revelados (fica acima do palco central) -->
    <div id="historico"></div>
</div>
<div class="toast" id="toast"></div>
<script>
    // ============================================================
    // 🔥 CONFIGURAÇÃO DO GOOGLE SHEETS (WEB APP)
    // ============================================================
    let APP_URL = '';
    try {
        APP_URL = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL)
            ? WEB_APP_URL
            : (window.WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbzmL1IU10IKyyjd6H48iRATaLmLWfOKnnjXFuQ70VAOn4l6zmlI5KHhenraDT24LCLzRg/exec');
    } catch (e) {
        APP_URL = window.WEB_APP_URL || 'https://script.google.com/macros/s/AKfycbzmL1IU10IKyyjd6H48iRATaLmLWfOKnnjXFuQ70VAOn4l6zmlI5KHhenraDT24LCLzRg/exec';
    }
    console.log('[Resultado] config.js carregado:', (typeof WEB_APP_URL !== 'undefined' || !!window.WEB_APP_URL));
    console.log('[Resultado] APP_URL:', APP_URL);

    const statusDot   = document.getElementById('statusDot');
    const statusText  = document.getElementById('statusText');
    const btnRevelar  = document.getElementById('btnRevelar');
    const palco       = document.getElementById('palco');
    const reveladosEl = document.getElementById('revelados');
    const historicoEl = document.getElementById('historico');
    const drumroll    = document.getElementById('drumroll');
    const estadoInicial = document.getElementById('estadoInicial');
    let toastTimer = null;

    // ===== ESTADO DA REVELAÇÃO =====
    let ranking = [];          // ranking completo vindo do servidor
    let demais  = [];          // classificados a partir do 4º
    let etapa   = 0;           // 0=demais, 1=3º, 2=2º, 3=1º (campeão)
    let revelacaoIniciada = false;

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function setStatus(online) {
        statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
        statusText.textContent = online ? 'Online' : 'Offline';
    }

    function esc(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function mediaDe(r) {
        return r.avaliacoes ? (r.total / r.avaliacoes).toFixed(1) : '0.0';
    }

    // ===== CARREGA RESULTADO =====
    async function carregarResultado() {
        try {
            if (!APP_URL) {
                showToast('⚠️ config.js não carregou ou WEB_APP_URL não definida.');
                setStatus(false);
                return;
            }
            const res = await fetch(APP_URL + '?acao=ranking');
            const json = await res.json();
            if (!json.ok) { showToast('⚠️ Erro ao carregar resultado.'); setStatus(false); return; }
            ranking = json.ranking || [];
            setStatus(true);
            prepararRevelacao();
        } catch (err) {
            console.error('[Resultado] Erro:', err);
            setStatus(false);
            showToast('⚠️ Erro de conexão.');
        }
    }

    // ===== PREPARA A SEQUÊNCIA DE REVELAÇÃO =====
    function prepararRevelacao() {
        revelacaoIniciada = false;
        etapa = 0;
        demais = ranking.slice(3);
        reveladosEl.innerHTML = '';
        historicoEl.innerHTML = '';
        const haDemais = demais.length > 0;
        const campeao = ranking[0];

        // Sem nenhuma avaliação
        if (!ranking.length) {
            estadoInicial.innerHTML = '<div class="icon">🎤</div><div class="texto">Ainda não há avaliações lançadas.</div><div class="sub">Assim que os jurados avaliarem, os resultados aparecem aqui.</div>';
            btnRevelar.style.display = 'none';
            return;
        }
        // Só um classificado: já apresenta o campeão direto
        if (ranking.length === 1) {
            estadoInicial.style.display = 'none';
            btnRevelar.textContent = '🏆 Revelar Campeão';
            btnRevelar.classList.add('final');
            return;
        }

        estadoInicial.style.display = 'block';
        btnRevelar.style.display = 'inline-block';
        btnRevelar.classList.remove('final');
        // Primeiro passo: demais classificados (se existirem), depois 3º, 2º, 1º
        if (haDemais) {
            btnRevelar.textContent = `🎲 Revelar ${demais.length}º ao 4º lugar`;
        } else {
            btnRevelar.textContent = '🎲 Revelar 3º lugar';
        }
    }

    // ===== REVELA O PRÓXIMO (clique) =====
    function revelarProximo() {
        if (revelacaoIniciada) return; // trava durante a animação
        revelacaoIniciada = true;
        btnRevelar.disabled = true;
        estadoInicial.style.display = 'none';

        const campeao = ranking[0];
        const segundo = ranking[1] || null;
        const terceiro = ranking[2] || null;

        // Se só existia o campeão, revela direto
        if (ranking.length === 1 && etapa === 0) {
            exibirCampeao(campeao);
            finalizarRevelacao();
            return;
        }

        // Identifica o que será revelado agora
        const alvo = (function () {
            if (etapa === 0 && demais.length) return { tipo: 'demais', qtd: demais.length };
            if (etapa === 1) return { tipo: 'p3', item: terceiro };
            if (etapa === 2) return { tipo: 'p2', item: segundo };
            return { tipo: 'p1', item: campeao };
        })();

        // Se o alvo não existir (ex.: sem 3º lugar), pula para o próximo
        if ((alvo.tipo === 'p3' && !terceiro) || (alvo.tipo === 'p2' && !segundo)) {
            proximaEtapa();
            revelacaoIniciada = false;
            btnRevelar.disabled = false;
            atualizarBotaoAposRevelacao();
            revelarProximo(); // segue direto para o próximo alvo válido
            return;
        }

        // ===== DRUMROLL DE SUSPENSE =====
        drumroll.classList.add('ativo');
        drumroll.querySelector('.texto').textContent = 'Drumroll...';
        setTimeout(() => {
            drumroll.classList.remove('ativo');
            exibir(alvo);
            proximaEtapa();
            revelacaoIniciada = false;
            btnRevelar.disabled = false;

            // Depois do campeão, não há mais nada para revelar
            if (alvo.tipo === 'p1') {
                finalizarRevelacao();
            } else {
                atualizarBotaoAposRevelacao();
            }
        }, 1800); // suspense de ~1,8s
    }

    function proximaEtapa() {
        if (etapa === 0 && demais.length) etapa = 1;
        else if (etapa === 1) etapa = 2;
        else if (etapa === 2) etapa = 3;
        else etapa = 4;
    }

    // ===== ATUALIZA O TEXTO DO BOTÃO APÓS CADA REVELAÇÃO =====
    function atualizarBotaoAposRevelacao() {
        const campeao = ranking[0];
        const segundo = ranking[1] || null;
        const terceiro = ranking[2] || null;
        if (etapa === 1) {
            btnRevelar.textContent = '🥉 Revelar 3º lugar';
        } else if (etapa === 2) {
            btnRevelar.textContent = '🥈 Revelar 2º lugar';
        } else if (etapa === 3) {
            btnRevelar.textContent = '🏆 Revelar o Grande Campeão';
            btnRevelar.classList.add('final');
        }
    }

    // ===== EXIBE O CARD REVELADO =====
    function exibir(alvo) {
        let html = '';
        if (alvo.tipo === 'demais') {
            const itens = demais.map((r, i) => `
                <div style="display:flex;justify-content:space-between;gap:14px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,0.06);">
                    <span style="font-weight:800;color:#009C3B;min-width:34px;text-align:left;">${i + 4}º</span>
                    <span style="flex:1;text-align:left;">${esc(r.candidato)}</span>
                    <span style="color:#4ade80;font-weight:700;">${r.total} pts · média ${mediaDe(r)}</span>
                </div>`).join('');
            html = `
                <div class="revelado p-outros">
                    <div class="place">Demais classificados</div>
                    <div style="margin-top:12px;text-align:left;padding:0 10px;">${itens}</div>
                </div>`;
        } else if (alvo.tipo === 'p3') {
            const r = alvo.item;
            html = `
                <div class="revelado p3">
                    <div class="place">🥉 3º Lugar</div>
                    <div class="nome">${esc(r.candidato)}</div>
                    <div class="score">${r.total} pts</div>
                    <div class="sub">${r.avaliacoes} nota(s) · média ${mediaDe(r)}</div>
                </div>`;
        } else if (alvo.tipo === 'p2') {
            const r = alvo.item;
            html = `
                <div class="revelado p2">
                    <div class="place">🥈 2º Lugar</div>
                    <div class="nome">${esc(r.candidato)}</div>
                    <div class="score">${r.total} pts</div>
                    <div class="sub">${r.avaliacoes} nota(s) · média ${mediaDe(r)}</div>
                </div>`;
        } else if (alvo.tipo === 'p1') {
            exibirCampeao(alvo.item);
            return;
        }
        reveladosEl.innerHTML += html;
    }

    // ===== CAMPEÃO COM CONFETES =====
    function exibirCampeao(campeao) {
        reveladosEl.innerHTML = '';
        historicoEl.innerHTML = '';
        document.getElementById('palco').innerHTML = `
            <div class="revelado p1" id="cardCampeao">
                <div class="trophy">🏆</div>
                <div class="place">Grande Campeão ShowTime</div>
                <div class="nome">${esc(campeao.candidato)}</div>
                <div class="score">${campeao.total} pontos</div>
                <div class="sub">${campeao.avaliacoes} nota(s) lançada(s) · média ${mediaDe(campeao)}</div>
            </div>`;
        lancarConfetes();
    }

    function lancarConfetes() {
        const card = document.getElementById('cardCampeao');
        if (!card) return;
        const cores = ['#FFD700', '#009C3B', '#FFDF00', '#ffffff', '#4ade80', '#f7971e'];
        for (let i = 0; i < 40; i++) {
            const c = document.createElement('div');
            c.className = 'confete';
            c.style.left = (Math.random() * 100) + '%';
            c.style.background = cores[Math.floor(Math.random() * cores.length)];
            c.style.animationDuration = (1.4 + Math.random() * 1.6) + 's';
            c.style.animationDelay = (Math.random() * 0.5) + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            c.style.width = (6 + Math.random() * 6) + 'px';
            c.style.height = (6 + Math.random() * 6) + 'px';
            card.appendChild(c);
        }
    }

    // ===== FIM DA REVELAÇÃO =====
    function finalizarRevelacao() {
        btnRevelar.textContent = '🔄 Reiniciar revelação';
        btnRevelar.classList.remove('final');
        btnRevelar.onclick = function () {
            btnRevelar.onclick = revelarProximo;
            const el = document.getElementById('palco');
            el.innerHTML = `
                <div class="suspense-box" id="estadoInicial">
                    <div class="icon">🎬</div>
                    <div class="texto">Os resultados estão prontos...</div>
                    <div class="sub">Clique no botão para revelar, um a um, do 3º lugar até o grande campeão.</div>
                </div>
                <div id="revelados" style="width:100%; display:flex; flex-direction:column; gap:10px; align-items:center;"></div>
                <button class="btn-revelar" id="btnRevelar">🎲 Revelar 3º lugar</button>
                <div id="drumroll"><div class="baquetas">🥁</div><div class="texto">Drumroll...</div><div class="sub">Preparando a revelação</div></div>`;
            prepararRevelacao();
        };
    }

    // ===== INICIA =====
    carregarResultado();
    // Atualiza em segundo plano apenas ANTES de o usuário iniciar a revelação,
    // para não estragar o suspense com um refresh automático no meio da apresentação.
    setInterval(() => {
        if (!revelacaoIniciada) carregarResultado();
    }, 15000);
</script>
</body>
</html>
